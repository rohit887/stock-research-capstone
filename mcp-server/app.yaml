# Databricks App config for the MCP server (`mcp-stock-research`).
# Deploy from workspace (not Git source). App name must start with `mcp-`.
#
# The server binds to $DATABRICKS_APP_PORT and serves MCP over streamable-HTTP;
# the endpoint lands at https://<app-url>/mcp.

command: ["python", "server.py"]

env:
  # --- non-secret config ---
  - name: "LAKEBASE_INSTANCE"
    value: "projects/stock-research-capstone/branches/production"
  - name: "PGDATABASE"
    value: "databricks_postgres"
  - name: "PGUSER"
    value: "student"
  - name: "EDGAR_CONTACT_EMAIL"
    value: "rohit885@gmail.com"

  # --- secrets ---
  # These reference Databricks secrets. Depending on your workspace's Apps version
  # the accepted form is either "scope/key" (below) or an app *resource* you first
  # declare (grant the app access to secret scopes `lakebase` and `capstone`).
  # PGHOST is derived at startup from LAKEBASE_INSTANCE, so it is not set here.
  - name: "PGPASSWORD"
    valueFrom: "lakebase/password"
  - name: "MASSIVE_API_KEY"
    valueFrom: "capstone/massive_api_key"
